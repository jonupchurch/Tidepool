name: Desktop build

# Release artifacts, not a per-push gate: a full Rust build on two platforms is
# minutes of CI, and `main` is already covered by the CI workflow. Fires on a
# version tag, or on demand via the Actions tab / `gh workflow run desktop.yml`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the other's artifacts.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tauri v2 on Linux needs webkit2gtk 4.1 and friends. Pinned to 22.04
      # rather than ubuntu-latest: the Steam Deck's runtime is older than
      # 24.04's glibc, and a binary linked against a newer glibc simply won't
      # start there.
      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential curl wget file

      # Rust ships preinstalled on GitHub runners; only the cache is worth adding.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.label }}-cargo-

      - run: npm ci

      - name: Build desktop app
        run: npm run desktop:build

      # The bare binary is what Steam ships — it distributes files directly and
      # runs the executable, so the installers are for everywhere else.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.label }}" = "windows" ]; then
            cp src-tauri/target/release/tidepool.exe out/
            cp src-tauri/target/release/bundle/nsis/*.exe out/ || true
            cp src-tauri/target/release/bundle/msi/*.msi out/ || true
          else
            cp src-tauri/target/release/tidepool out/
            cp src-tauri/target/release/bundle/appimage/*.AppImage out/ || true
            cp src-tauri/target/release/bundle/deb/*.deb out/ || true
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: tidepool-${{ matrix.label }}
          path: out/
          if-no-files-found: error
