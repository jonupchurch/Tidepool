[package]
name = "tidepools"
version = "1.0.1"
description = "A cozy hex logic puzzle."
authors = ["Gravytraining"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "tidepools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# The shipped binary is what a player downloads and what Steam ships as a depot,
# so optimise it for size over speed. All the game's real work happens in the
# webview; there is nothing here hot enough to notice the difference.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
